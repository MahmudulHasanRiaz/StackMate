name: Deploy Production

# Manual only. There is NO push trigger: the owner triggers this from
# the Actions tab and approves it via the GitHub `production`
# environment. A live deployment is complete only when this workflow
# and the post-deployment live smoke checks succeed.
#
# Order (ADR-0002): verify -> migrations (direct Neon URL, NEVER
# Hyperdrive) -> deploy API Worker -> deploy Admin SPA -> live smoke
# checks. A failed migration blocks all application deployment.
#
# There is NO staging deploy path in this file yet: no staging
# Cloudflare resources and no staging Neon branch/database exist
# (verified 2026-11-15). Do not add one by inventing resource names;
# staging needs its own Neon branch/database plus its own
# environment/secrets/vars, documented in
# docs/operations/CI-CD-AND-MIGRATIONS.md first.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "production" to confirm this deploys to PRODUCTION'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Pre-Deployment Verification Gate
    runs-on: ubuntu-latest
    steps:
      - name: Confirm production deployment was explicitly typed
        run: |
          if [ "${{ inputs.confirm }}" != "production" ]; then
            echo 'Aborting: the confirm input must be exactly "production".'
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Exact version from the packageManager field in package.json.
          version: 10.6.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node version from .nvmrc (24.22.1).
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run repository, migration, lint, typecheck, test, and build gates
        # pnpm test here runs unit tests only (no DATABASE_URL, so the
        # Postgres integration suite skips cleanly). The integration
        # suite runs, unskipped, in CI on the same commit.
        run: |
          pnpm run validate:repo
          pnpm run db:check
          pnpm run lint
          pnpm run typecheck
          pnpm test
          pnpm run build

  migrate-db:
    name: Apply Forward-Only PostgreSQL Migrations (Direct Neon URL)
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Guard DIRECT_DATABASE_URL (must be set, must be a direct Neon URL)
        # Migrations use the DIRECT Neon connection, NEVER Hyperdrive
        # (Hyperdrive transaction pooling breaks DDL advisory locks).
        # The migrate runner itself also fails closed when the URL is
        # unset; this guard additionally rejects a Hyperdrive URL
        # pasted into the secret by mistake. The secret value is
        # never printed.
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: |
          if [ -z "$DIRECT_DATABASE_URL" ]; then
            echo "ERROR: secrets.DIRECT_DATABASE_URL is not set. Add the direct (non-pooled) Neon connection string to the production environment secrets."
            exit 1
          fi
          case "$DIRECT_DATABASE_URL" in
            *[Hh]yperdrive*)
              echo "ERROR: DIRECT_DATABASE_URL looks like a Hyperdrive URL. Migrations must use the direct Neon connection string, never Hyperdrive."
              exit 1
              ;;
          esac
          echo "DIRECT_DATABASE_URL is set and is not a Hyperdrive URL."

      - name: Verify migration journal and SQL checksums
        run: pnpm run db:check

      - name: Execute forward-only SQL migrations against DIRECT_DATABASE_URL
        # scripts/migrate.mjs: advisory-locked, checksum-verified,
        # transactional per migration; fails closed on checksum
        # mismatch or SQL error. Reads DATABASE_MIGRATION_URL first,
        # then DATABASE_URL. No destructive down-migrations exist.
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: pnpm run db:migrate:deploy

  deploy-api:
    name: Deploy Cloudflare Worker API (Hyperdrive + R2)
    needs: migrate-db
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Guard Cloudflare config (real Hyperdrive IDs required)
        # apps/api/wrangler.jsonc ships with REPLACE_WITH_* placeholder
        # Hyperdrive IDs. A real deploy cannot work until the owner
        # replaces them with the real Hyperdrive config IDs.
        run: |
          if grep -q "REPLACE_WITH_" apps/api/wrangler.jsonc; then
            echo "ERROR: apps/api/wrangler.jsonc still contains REPLACE_WITH_* placeholder Hyperdrive IDs. Replace them with the real production Hyperdrive config IDs before deploying."
            exit 1
          fi

      - name: Build API bundle and Admin SPA
        run: pnpm run build

      - name: Deploy Worker API to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @stackmate/api run deploy

      - name: Guard deployed API URL variable
        run: |
          if [ -z "${{ vars.STACKMATE_API_URL }}" ]; then
            echo "ERROR: vars.STACKMATE_API_URL is not set. Set the deployed API base URL (e.g. https://stackmate-api.<subdomain>.workers.dev) as a production environment variable."
            exit 1
          fi

      - name: Live smoke check against the deployed API
        # Real check against the deployed Worker (not the in-memory
        # smoke check, which already ran in the verify gate).
        run: curl -fsS "${{ vars.STACKMATE_API_URL }}/api/v1/health"

  deploy-admin:
    name: Deploy Admin SPA
    needs: deploy-api
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build Admin SPA
        run: pnpm --filter @stackmate/admin run build

      - name: Deploy Admin SPA to Cloudflare Pages
        # wrangler is a devDependency of @stackmate/api ONLY;
        # @stackmate/admin has no wrangler binary (its own `deploy`
        # script fails with "Command wrangler not found"), so deploy
        # through the API package's wrangler. The path is relative to
        # apps/api (where pnpm --filter executes), hence
        # ../../apps/admin/dist. Project name `stackmate-admin` is the
        # name declared in apps/admin/package.json.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @stackmate/api exec wrangler pages deploy ../../apps/admin/dist --project-name stackmate-admin

      - name: Guard deployed Admin URL variable
        run: |
          if [ -z "${{ vars.STACKMATE_ADMIN_URL }}" ]; then
            echo "ERROR: vars.STACKMATE_ADMIN_URL is not set. Set the deployed Admin base URL (e.g. https://stackmate-admin.pages.dev) as a production environment variable."
            exit 1
          fi

      - name: Live smoke check against the deployed Admin SPA
        run: curl -fsS "${{ vars.STACKMATE_ADMIN_URL }}"
