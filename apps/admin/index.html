<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StackMate Admin</title>
    <!-- Default favicon endpoint (General Settings): serves the uploaded
         favicon when one exists, 404s otherwise — the runtime
         GeneralConfigApplier replaces this link when a favicon is set. -->
    <link rel="icon" href="/api/v1/favicon" />
    <script>
      // Theme bootstrap: apply the persisted theme choice (localStorage
      // `sm-theme`: "system" | "dark" | "light", default dark — Neon)
      // before React mounts, so there is no flash. "system" follows the
      // OS preference at load; the live listener in lib/theme.ts takes
      // over after mount.
      try {
        var t = localStorage.getItem("sm-theme");
        var theme = "dark";
        if (t === "light") {
          theme = "light";
        } else if (
          t === "system" &&
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: light)").matches
        ) {
          theme = "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
