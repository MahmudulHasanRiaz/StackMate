<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StackMate Admin</title>
    <script>
      // Theme bootstrap: apply the persisted theme (localStorage `sm-theme`,
      // default dark — Neon) before React mounts, so there is no flash.
      try {
        var t = localStorage.getItem("sm-theme");
        document.documentElement.setAttribute(
          "data-theme",
          t === "light" ? "light" : "dark"
        );
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
